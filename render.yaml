services:
  - type: web
    name: pruf
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: CONTACT_EMAIL
        sync: false
