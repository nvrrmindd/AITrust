services:
  - type: web
    name: pruf
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_MODEL_EXTRACT
        value: gemini-3.5-flash-lite,gemini-3.1-flash-lite
      - key: LLM_MODEL_JUDGE
        value: gemini-3.8-flash,gemini-flash-latest,gemini-3.5-flash
      - key: LLM_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: OPENALEX_API_KEY
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
